    // Name shown in the greeting and the pop-up
    name: "",

    // Who the greeting is from (shows as "With love, ...")
    from: "-Mga tropa sa GC, <yri>",

    // The birthday message
    message: "HBD stay safe and takecare always enjoy everything. ",

    // Happy Birthday music (starts when the gift is opened).
    //   true  -> play the song, with a sound button in the top-right corner
    //   false -> no music at all
    music: true,

    // Photo in the pop-up.
    //   ""          -> use the photo embedded at the bottom of this file
    //   "photo.jpg" -> use your own picture saved in the same folder as this file
    //   "none"      -> no photo, show the gift box instead
    photo: "",

    // QR code image shown on the page after the candles are blown out.
    //   ""          -> use the QR code embedded at the bottom of this file
    //   "qr.png"    -> use your own QR image saved in the same folder
    //   "none"      -> do not show a QR code on the page
    qr: "",
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4EDFF;
    --halo: #E6D9FF;
    --ink: #2A1245;
    --muted: #6B5A85;
    --plate: #FFFFFF;
    --pink: #FF7EB6;
    --sponge: #FFC85C;
    --sponge-top: #FFDC8F;
    --accent: #7A5CFF;
    --btn-bg: #2A1245;
    --btn-ink: #FFFFFF;
    --display: "Bagel Fat One", "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
    --body: "Bricolage Grotesque", "Trebuchet MS", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B0A30;
      --halo: #2C1550;
      --ink: #FFF1E2;
      --muted: #BBA8D9;
      --plate: #3A2160;
      --btn-bg: #FFF1E2;
      --btn-ink: #1B0A30;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B0A30;
    --halo: #2C1550;
    --ink: #FFF1E2;
    --muted: #BBA8D9;
    --plate: #3A2160;
    --btn-bg: #FFF1E2;
    --btn-ink: #1B0A30;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px 20px 40px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    overflow-x: hidden;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 560px;
    display: grid;
    gap: 8px;
    justify-items: center;
    text-align: center;
  }
  /* flat circle that sits behind the cake */
  .stage::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    width: min(92vw, 460px);
    aspect-ratio: 1;
    transform: translateX(-50%);
    border-radius: 50%;
    background: var(--halo);
    z-index: 0;
  }
  .stage > * { position: relative; z-index: 1; }

  /* ---------- cake ---------- */
  .cake {
    width: min(84vw, 380px);
    height: auto;
    overflow: visible;
    display: block;
  }
  .candle { cursor: pointer; outline: none; }
  .candle .hit { fill: transparent; stroke: transparent; stroke-width: 3; rx: 10; }
  .candle:focus-visible .hit { stroke: var(--accent); }
  .flame {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: flicker 1.1s ease-in-out infinite alternate;
    animation-delay: var(--d, 0s);
    transition: transform .25s ease, opacity .25s ease;
  }
  @keyframes flicker {
    0%   { transform: scale(1, 1) rotate(-2deg); }
    50%  { transform: scale(.94, 1.07) rotate(2deg); }
    100% { transform: scale(1.05, .95) rotate(-1deg); }
  }
  .candle.out .flame { animation: none; transform: scale(.15); opacity: 0; }
  .smoke {
    fill: var(--muted);
    opacity: 0;
    transform-box: fill-box;
    transform-origin: 50% 100%;
  }
  .candle.out .smoke { animation: smoke 1.5s ease-out forwards; }
  @keyframes smoke {
    0%   { opacity: .55; transform: translateY(0) scale(.6); }
    100% { opacity: 0;   transform: translateY(-30px) scale(1.5); }
  }
  .stage.done .cake { animation: hop .7s ease-out; }
  @keyframes hop {
    0% { transform: translateY(0); }
    35% { transform: translateY(-14px) rotate(-1.5deg); }
    70% { transform: translateY(0) rotate(1deg); }
    100% { transform: translateY(0); }
  }

  /* ---------- text (prompt and greeting share one grid cell) ---------- */
  .copy { display: grid; width: 100%; margin-top: 10px; }
  .copy > * {
    grid-area: 1 / 1;
    transition: opacity .5s ease, transform .5s ease, visibility .5s;
  }
  .prompt { display: grid; gap: 10px; justify-items: center; align-content: start; }
  .greeting {
    display: grid; gap: 14px; justify-items: center; align-content: start;
    opacity: 0; visibility: hidden; transform: translateY(12px);
  }
  .stage.done .prompt { opacity: 0; visibility: hidden; transform: translateY(-8px); }
  .stage.done .greeting { opacity: 1; visibility: visible; transform: none; }

  h2, h1 { margin: 0; font-family: var(--display); font-weight: 400; line-height: 1.02; letter-spacing: .005em; }
  .prompt h2 { font-size: clamp(2rem, 8vw, 2.8rem); }
  .greeting h1 {
    font-size: clamp(2.4rem, 10vw, 4.4rem);
    overflow-wrap: anywhere;
    text-wrap: balance;
  }
  .greeting h1:focus { outline: none; }
  p { margin: 0; }
  .hint { color: var(--muted); font-size: 1.05rem; }
  .count { color: var(--muted); font-size: .95rem; min-height: 1.4em; }
  .message {
    max-width: 34ch;
    font-size: 1.15rem;
    line-height: 1.55;
    text-wrap: pretty;
  }
  .sign { color: var(--muted); font-size: 1rem; }

  .btn {
    appearance: none;
    border: 0;
    border-radius: 999px;
    padding: 12px 24px;
    background: var(--btn-bg);
    color: var(--btn-ink);
    font: 600 1rem/1 var(--body);
    cursor: pointer;
    transition: transform .15s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .btn.ghost {
    background: transparent;
    color: var(--ink);
    box-shadow: inset 0 0 0 2px var(--ink);
  }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }

  /* ---------- QR card ---------- */
  .qr { margin: 6px 0 0; display: grid; gap: 8px; justify-items: center; }
  .qr img { display: block; width: 152px; height: 152px; padding: 6px; background: #fff; border-radius: 12px; }
  .qr figcaption { color: var(--muted); font-size: .9rem; max-width: 24ch; }
  .qr[hidden] { display: none; }

  /* ---------- music button (top-right corner) ---------- */
  .sound {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 20;
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: var(--btn-bg);
    color: var(--btn-ink);
    cursor: pointer;
    transition: transform .15s ease;
  }
  .sound:hover { transform: scale(1.06); }
  .sound:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .sound[hidden] { display: none; }
  .sound svg { display: block; width: 24px; height: 24px; }
  .sound .waves { display: none; }
  .sound[aria-pressed="true"] .waves { display: inline; }
  .sound[aria-pressed="true"] .x { display: none; }

  /* ---------- intro pop-up ---------- */
  dialog.intro {
    border: 0;
    padding: 0;
    background: transparent;
    color: var(--ink);
    width: min(92vw, 420px);
    max-width: none;
    overflow: visible;
  }
  dialog.intro::backdrop { background: rgba(20, 6, 38, .88); }
  .intro-card {
    display: grid;
    gap: 12px;
    justify-items: center;
    text-align: center;
    padding: 28px 24px 30px;
    background: var(--bg);
    border-radius: 28px;
    box-shadow: 0 0 0 3px var(--accent);
    animation: pop .55s cubic-bezier(.2, 1.3, .4, 1) both;
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(.8) translateY(24px); }
    to   { opacity: 1; transform: none; }
  }
  .intro h2 { font-size: clamp(1.8rem, 7vw, 2.4rem); overflow-wrap: anywhere; text-wrap: balance; }
  .gift { width: min(64vw, 250px); height: auto; overflow: visible; display: block; }
  .intro .photo {
    display: block;
    width: min(60vw, 220px);
    aspect-ratio: 1;
    object-fit: cover;
    object-position: 50% 30%;
    border-radius: 50%;
    border: 6px solid var(--pink);
  }
  .intro [hidden] { display: none; }

  .gift .balloons {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: bob 3s ease-in-out infinite alternate;
    transition: transform .7s ease, opacity .6s ease;
  }
  @keyframes bob {
    from { transform: translateY(0); }
    to   { transform: translateY(-8px); }
  }
  .gift .lid {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    transition: transform .6s cubic-bezier(.3, 1.4, .5, 1), opacity .5s ease .1s;
  }
  .intro.opening .gift .lid { transform: translateY(-52px) rotate(-14deg); opacity: 0; }
  .intro.opening .gift .balloons { animation: none; transform: translateY(-70px); opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    .intro-card { animation: none; }
    .gift .balloons { animation: none; }
    .gift .balloons, .gift .lid { transition: none; }
  }

  canvas#confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  @media (prefers-reduced-motion: reduce) {
    .flame { animation: none; }
    .stage.done .cake { animation: none; }
    .copy > * { transition: none; }
  }
</style>
</head>

<script>
  const params = new URLSearchParams(location.search);
  const name = (params.get("name") || CONFIG.name).slice(0, 40);
  const from = (params.get("from") || CONFIG.from).slice(0, 40);

  document.getElementById("name").textContent = name;
  document.getElementById("message").textContent = CONFIG.message;
  document.getElementById("sign").textContent = "" + from;
  document.title = "Happy bortdey ubre" + name + "";

  // ---------------------------------------------------------------
  // Candles
  // ---------------------------------------------------------------
  const stage = document.getElementById("stage");
  const cake = document.getElementById("cake");
  const candles = Array.from(document.querySelectorAll(".candle"));
  const countEl = document.getElementById("count");
  const titleEl = document.getElementById("title");
  let lit = candles.length;

  function updateCount() {
    countEl.textContent = lit === 1 ? "1 candle left" : lit + " candles left";
  }

  function blow(candle) {
    if (candle.classList.contains("out")) return;
    candle.classList.add("out");
    candle.setAttribute("aria-pressed", "true");
    lit--;
    if (lit === 0) {
      setTimeout(celebrate, 350);
    } else {
      updateCount();
    }
  }

  candles.forEach(function (c) {
    c.addEventListener("click", function () { blow(c); });
    c.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); blow(c); }
    });
  });

  document.getElementById("blowAll").addEventListener("click", function () {
    candles.forEach(function (c, i) {
      setTimeout(function () { blow(c); }, i * 140);
    });
  });

  document.getElementById("relight").addEventListener("click", function () {
    candles.forEach(function (c) {
      c.classList.remove("out");
      c.setAttribute("aria-pressed", "false");
    });
    lit = candles.length;
    updateCount();
    stage.classList.remove("done");
  });

  document.getElementById("party").addEventListener("click", function () { celebrate(true); });

  function celebrate(again) {
    stage.classList.add("done");
    if (!again) titleEl.focus({ preventScroll: true });
    // if the song is not already playing (or was not stopped by the user), play it again
    if (!again && !playing && !userStopped) playSong();
    var r = cake.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height * 0.3, 140);
    rain(3500);
  }

  // ---------------------------------------------------------------
  // Confetti
  // ---------------------------------------------------------------
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cv = document.getElementById("confetti");
  var ctx = cv.getContext("2d");
  var W = 0, H = 0;
  var parts = [];
  var raf = null;
  var COLORS = ["#FF7EB6", "#FFC85C", "#3CCFB4", "#7A5CFF", "#FF9F5A", "#FFFFFF"];

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = W * dpr;
    cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  function piece(x, y, vx, vy) {
    return {
      x: x, y: y, vx: vx, vy: vy,
      w: 6 + Math.random() * 7,
      h: 3 + Math.random() * 5,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.35,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      round: Math.random() < 0.25
    };
  }

  function burst(x, y, n) {
    if (reduceMotion) return;
    for (var i = 0; i < n; i++) {
      var a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.3;
      var s = 6 + Math.random() * 10;
      parts.push(piece(x, y, Math.cos(a) * s, Math.sin(a) * s));
    }
    start();
  }

  function rain(ms) {
    if (reduceMotion) return;
    var end = performance.now() + ms;
    (function tick() {
      if (performance.now() > end) return;
      for (var i = 0; i < 3; i++) {
        parts.push(piece(Math.random() * W, -12, (Math.random() - 0.5) * 2, 2 + Math.random() * 3));
      }
      start();
      setTimeout(tick, 90);
    })();
  }

  function start() { if (!raf) raf = requestAnimationFrame(frame); }

  function frame() {
    ctx.clearRect(0, 0, W, H);
    parts = parts.filter(function (p) { return p.y < H + 30; });
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.vy = Math.min(p.vy + 0.22, 7);
      p.vx *= 0.99;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.round) {
        ctx.beginPath();
        ctx.arc(0, 0, p.h, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      }
      ctx.restore();
    }
    raf = parts.length ? requestAnimationFrame(frame) : null;
    if (!parts.length) ctx.clearRect(0, 0, W, H);
  }

  // ---------------------------------------------------------------
  // Music: "Happy Birthday" played with the Web Audio API
  // (no audio file needed - the notes are played by the browser)
  // ---------------------------------------------------------------
  var AudioCtor = window.AudioContext || window.webkitAudioContext;
  var actx = null;
  var current = null;
  var endTimer = null;
  var playing = false;
  var userStopped = false;   // true if someone pressed the button to stop the music
  var musicOn = CONFIG.music !== false && !!AudioCtor;
  var soundBtn = document.getElementById("sound");
  if (!musicOn) soundBtn.hidden = true;

  var NOTE = { G4: 392.00, A4: 440.00, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99 };
  // [note, length in beats] - three beats to a bar
  var SONG = [
    ["G4", .75], ["G4", .25], ["A4", 1], ["G4", 1], ["C5", 1], ["B4", 2],
    ["G4", .75], ["G4", .25], ["A4", 1], ["G4", 1], ["D5", 1], ["C5", 2],
    ["G4", .75], ["G4", .25], ["G5", 1], ["E5", 1], ["C5", 1], ["B4", 1], ["A4", 1],
    ["F5", .75], ["F5", .25], ["E5", 1], ["C5", 1], ["D5", 1], ["C5", 3]
  ];
  var BEAT = 0.58; // seconds per beat: a bigger number plays the song slower

  function setPlayingUI(on) {
    soundBtn.setAttribute("aria-pressed", on ? "true" : "false");
    soundBtn.setAttribute("aria-label", on ? "Stop the music" : "Play the birthday song");
  }

  // one soft, bell-like note
  function bell(freq, when, len, out, echo) {
    var o1 = actx.createOscillator();
    var o2 = actx.createOscillator();
    var g = actx.createGain();
    var g2 = actx.createGain();
    o1.type = "sine";     o1.frequency.value = freq;
    o2.type = "triangle"; o2.frequency.value = freq * 2;
    g2.gain.value = 0.22;
    var tail = Math.min(len + 0.5, 1.8);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(0.32, when + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, when + tail);
    o1.connect(g);
    o2.connect(g2);
    g2.connect(g);
    g.connect(out);
    g.connect(echo);
    o1.start(when);
    o2.start(when);
    o1.stop(when + tail + 0.05);
    o2.stop(when + tail + 0.05);
  }

  function playSong() {
    if (!musicOn) return;
    if (!actx) actx = new AudioCtor();
    if (actx.state === "suspended") actx.resume();
    stopSong(true);

    var master = actx.createGain();
    master.gain.value = 0.85;
    master.connect(actx.destination);

    // a little echo makes it sound like a music box
    var echo = actx.createDelay();
    echo.delayTime.value = 0.27;
    var fb = actx.createGain();
    fb.gain.value = 0.28;
    var wet = actx.createGain();
    wet.gain.value = 0.3;
    echo.connect(fb);
    fb.connect(echo);
    echo.connect(wet);
    wet.connect(master);

    var t = actx.currentTime + 0.1;
    SONG.forEach(function (n) {
      var len = n[1] * BEAT;
      bell(NOTE[n[0]], t, len, master, echo);
      t += len;
    });

    current = { master: master, echo: echo };
    playing = true;
    setPlayingUI(true);
    endTimer = setTimeout(function () { stopSong(); }, (t - actx.currentTime + 2) * 1000);
  }

  function stopSong(quiet) {
    clearTimeout(endTimer);
    if (current) {
      var c = current;
      current = null;
      c.master.gain.cancelScheduledValues(actx.currentTime);
      c.master.gain.setTargetAtTime(0, actx.currentTime, 0.04);
      setTimeout(function () {
        try { c.master.disconnect(); c.echo.disconnect(); } catch (e) {}
      }, 500);
    }
    playing = false;
    if (!quiet) setPlayingUI(false);
  }

  soundBtn.addEventListener("click", function () {
    if (playing) { userStopped = true; stopSong(); }
    else { userStopped = false; playSong(); }
  });

  // stop the music if the page is hidden (screen locked, another tab, ...)
  document.addEventListener("visibilitychange", function () {
    if (document.hidden && playing) stopSong();
  });

  // ---------------------------------------------------------------
  // Intro pop-up (shows before the candles)
  // ---------------------------------------------------------------
  var intro = document.getElementById("intro");
  document.getElementById("introName").textContent = name;

  function embedded(id) {
    var el = document.getElementById(id);
    return el ? el.textContent.trim() : "";
  }

  // runs once the whole file is loaded (the embedded images sit at the bottom)
  document.addEventListener("DOMContentLoaded", function () {
    var photoSrc = CONFIG.photo === "none" ? "" : (CONFIG.photo || embedded("photo-data"));
    if (photoSrc) {
      var photo = document.getElementById("introPhoto");
      photo.src = photoSrc;
      photo.alt = "Photo of " + name;
      photo.hidden = false;
      document.getElementById("giftArt").setAttribute("hidden", ""); // (svg has no .hidden property)
    }

    var qrSrc = CONFIG.qr === "none" ? "" : (CONFIG.qr || embedded("qr-data"));
    var qrImg = document.getElementById("qrImg");
    if (qrSrc && qrImg) {
      qrImg.src = qrSrc;
      document.getElementById("qrCaption").textContent = CONFIG.qrCaption || "";
      document.getElementById("qrBox").hidden = false;
    }
  });

  function openIntro() {
    if (intro.classList.contains("opening")) return;
    intro.classList.add("opening");
    // this tap also lets the browser start the sound
    if (!userStopped) playSong();
    setTimeout(function () {
      if (intro.open) intro.close();
      burst(window.innerWidth / 2, window.innerHeight * 0.45, 70);
    }, reduceMotion ? 0 : 800);
  }

  document.getElementById("openGift").addEventListener("click", openIntro);
  // pressing Esc should also open the surprise rather than skip it awkwardly
  intro.addEventListener("cancel", function (e) { e.preventDefault(); openIntro(); });

  if (typeof intro.showModal === "function") intro.showModal();

  // tapping the cake after the reveal throws a little more confetti
  cake.addEventListener("click", function (e) {
    if (stage.classList.contains("done")) burst(e.clientX, e.clientY, 50);
  });
</script>
